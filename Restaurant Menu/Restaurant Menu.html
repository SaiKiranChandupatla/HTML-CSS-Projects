<!DOCTYPE html>
    <html>
        <head>
            <title>Restaurant Menu</title>

            <style>

                body {
                    background-color: lightgray;
                    font-family: Arial;
                }

                h1 {
                    text-align: center;
                    color: darkblue;
                    font-size: 28px;
                }

                h2 {
                    color: darkblue;
                    font-size: 20px;
                }
                
                .menu-section {
                    background-color: white;
                    max-width: 450px;
                    margin: 30px auto;
                    padding: 20px;
                    border: 2px solid gray;
                    border-radius: 10px;
                    box-shadow: 0 4px 8px gray;
                }

                .menu-item {
                    display: flex;
                    justify-content: space-between;
                    padding: 10px 0;
                    
                }
                
                .price {
                    color: darkgreen;
                    font-weight: bold;
                }

                .menu-item:hover {
                    background-color: lightgray;
                    border-radius: 5px;
                    cursor: pointer;
                }

                @media (max-width: 600px) {
                    .menu-section {
                        margin: 15px;
                    }
                }

            </style>
        </head>

        <body>

            <h1>Restaurant Menu</h1>
            
            <div class="menu-section">
            
                <h2>Starters</h2>

                <div class="menu-item">
                    <span>Veg Manchurian</span>
                    <span class="price">₹180</span>
                </div>

                <div class="menu-item">
                    <span>Paneer Tikka</span>
                    <span class="price">₹220</span>
                </div>

                <div class="menu-item">
                    <span>French Fries</span>
                    <span class="price">₹150</span>
                </div>

            </div>

            <div class="menu-section">

                <h2>Main Course</h2>

                <div class="menu-item">
                    <span>Veg Biryani</span>
                    <span class="price">₹250</span>
                </div>

                <div class="menu-item">
                    <span>Paneer Biryani</span>
                    <span class="price">₹280</span>
                </div>

                <div class="menu-item">
                    <span>Butter Naan</span>
                    <span class="price">₹80</span>
                </div>

            </div>

            <div class="menu-section">

                <h2>Desserts</h2>

                <div class="menu-item">
                    <span>Ice Cream</span>
                    <span class="price">₹120</span>
                </div>

                <div class="menu-item">
                    <span>Gulab Jamun</span>
                    <span class="price">₹100</span>
                </div>

                <div class="menu-item">
                    <span>Chocolate Brownie</span>
                    <span class="price">₹80</span>
                </div>

            </div>

        </body>
    </html>
